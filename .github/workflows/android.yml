name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # needed to publish releases on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK; use its own sdkmanager rather than a setup action.
      - name: Install SDK platform 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Signs with the release key when the repository secrets are there; otherwise the build falls
      # back to the debug key and a tag isn't published (releases are then signed and uploaded by hand).
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.SPEND_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SPEND_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_KEY=true" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::notice::SPEND_KEYSTORE_BASE64 is not set; building with the debug key and not publishing this tag."
          fi

      - name: Build release APK
        env:
          SPEND_KEYSTORE_PASSWORD: ${{ secrets.SPEND_KEYSTORE_PASSWORD }}
          SPEND_KEY_ALIAS: ${{ secrets.SPEND_KEY_ALIAS }}
          SPEND_KEY_PASSWORD: ${{ secrets.SPEND_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # One fixed name, so https://github.com/<repo>/releases/latest/download/SpendTracker.apk
      # (the website's download link) always points at the newest release.
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk SpendTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpendTracker-apk
          path: SpendTracker.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASE_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: SpendTracker.apk
          generate_release_notes: true
