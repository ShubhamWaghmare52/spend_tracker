name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # needed to publish releases on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK; use its own sdkmanager rather than a setup action.
      - name: Install SDK platform 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # Tags are published, so they must be signed with the release key (repository secrets).
      # Other builds fall back to the debug key when the secrets aren't there.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.SPEND_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SPEND_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::SPEND_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed release." && exit 1
          fi

      - name: Build release APK
        env:
          SPEND_KEYSTORE_PASSWORD: ${{ secrets.SPEND_KEYSTORE_PASSWORD }}
          SPEND_KEY_ALIAS: ${{ secrets.SPEND_KEY_ALIAS }}
          SPEND_KEY_PASSWORD: ${{ secrets.SPEND_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Name the APK
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk "SpendTracker-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SpendTracker-apk
          path: SpendTracker-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SpendTracker-*.apk
          generate_release_notes: true
